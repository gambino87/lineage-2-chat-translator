limit_conn_zone $binary_remote_addr zone=l2ct_connections:1m;

server {
    listen 80 default_server;
    server_name 40.160.140.227;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/l2ct-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://40.160.140.227$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 40.160.140.227;
    root /srv/l2-chat-translator/current;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1k;
    keepalive_timeout 30;
    max_ranges 1;
    limit_conn l2ct_connections 16;

    ssl_certificate /etc/letsencrypt/live/l2-chat-translator-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l2-chat-translator-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:L2CT_TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/l2-chat-translator.access.log;
    error_log /var/log/nginx/l2-chat-translator.error.log;
    include /etc/nginx/snippets/l2ct-security-headers.conf;

    location ~ /\. { return 404; }
    location = /_headers { return 404; }

    location ~ ^/downloads/(?<installer>Lineage-2-Chat-Translator-[0-9]+\.[0-9]+\.[0-9]+-Setup\.exe)$ {
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/l2ct-security-headers.conf;
        add_header Content-Disposition 'attachment; filename="$installer"';
        add_header Cache-Control "public, max-age=31536000, immutable";
        limit_conn l2ct_connections 4;
        limit_rate_after 2m;
        limit_rate 4m;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /downloads/release.json {
        include /etc/nginx/snippets/l2ct-security-headers.conf;
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location = /downloads/release.sig {
        types { }
        default_type application/octet-stream;
        include /etc/nginx/snippets/l2ct-security-headers.conf;
        add_header Cache-Control no-cache;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /downloads/SHA256SUMS.txt {
        include /etc/nginx/snippets/l2ct-security-headers.conf;
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location /downloads/ { return 404; }
    location / {
        include /etc/nginx/snippets/l2ct-security-headers.conf;
        add_header Cache-Control no-cache;
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
